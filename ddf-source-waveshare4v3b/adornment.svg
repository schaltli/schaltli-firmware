<?xml version="1.0" encoding="UTF-8"?>
<!--
  Adornment for the Waveshare ESP32-S3-Touch-LCD-4.3B.

  Drawn to scale rather than decoratively: the case version of this board
  measures 116.3 x 79 mm and its active area 93.6 x 56.2 mm, so at 800px
  across the screen one millimetre is 8.547px. That puts the case at
  994 x 675 and leaves a bezel of 97px on every side. The designer shows
  this behind the canvas, and a bezel invented by eye would make every
  layout look better or worse placed than it really is.

  THE SCREEN IS A PUNCHED-OUT HOLE, not an unfilled rect on top. The first
  version of this file got that wrong in exactly the way DEVICE_GUIDE.md
  warns about: the adornment is drawn *over* the project canvas, so an
  opaque body shape covers the whole design and a `fill="none"` rect laid on
  top removes nothing - it just paints nothing additional. The body below is
  therefore one path with fill-rule="evenodd" and two subpaths, outer case
  and inner screen, which is the SVG equivalent of Inkscape's
  Path -> Difference.

  Conventions (DEVICE_GUIDE.md, "Building the adornment SVG"):
    - explicit width/height on <svg>, not viewBox alone: the designer loads
      this as an Image() and draws it at its natural size
    - nothing extends past the document edge, or it is silently discarded
    - <rect id="screen"> is a measurement-only marker, read for its own
      x/y/width/height; the visible hole is the path
  This board has no user-facing hardware buttons - RESET and BOOT are
  recessed and nothing a screen design can bind to - so there are no button
  elements and no hardwareButtons entry in device.json.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="994" height="675" viewBox="0 0 994 675">
  <defs>
    <!-- Case: lit from above, a shade lighter at the top than the bottom. -->
    <linearGradient id="case-shade" x1="0" y1="0" x2="0" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34343c" />
      <stop offset="1" stop-color="#16161a" />
    </linearGradient>
    <!-- Rim highlight: bright along the top edge, fading out towards the
         bottom, so the case reads as a body on a dark canvas too. -->
    <linearGradient id="rim-light" x1="0" y1="0" x2="0" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <!-- Glass border: a faint sheen across the black print around the
         active area. -->
    <linearGradient id="glass-sheen" x1="79" y1="79" x2="915" y2="596" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2a31" />
      <stop offset="0.45" stop-color="#0c0c0f" />
      <stop offset="1" stop-color="#050507" />
    </linearGradient>
  </defs>

  <!-- Case with the screen punched out. Outer subpath: the rounded shell,
       corners ~6mm (51px). Inner subpath: the active area at 97,97.5,
       800x480, wound so evenodd removes it. -->
  <path id="case"
        fill-rule="evenodd"
        fill="url(#case-shade)"
        d="M 51,0 H 943 A 51,51 0 0 1 994,51 V 624 A 51,51 0 0 1 943,675 H 51
           A 51,51 0 0 1 0,624 V 51 A 51,51 0 0 1 51,0 Z
           M 97,97.5 H 897 V 577.5 H 97 Z" />

  <!-- Rim highlight, inset by half its width so nothing crosses the
       document edge. Outline only: a fill here would cover the hole. -->
  <path id="case-rim"
        fill="none"
        stroke="url(#rim-light)"
        stroke-width="3"
        d="M 51,1.5 H 943 A 49.5,49.5 0 0 1 992.5,51 V 624 A 49.5,49.5 0 0 1 943,673.5 H 51
           A 49.5,49.5 0 0 1 1.5,624 V 51 A 49.5,49.5 0 0 1 51,1.5 Z" />

  <!-- The cover glass's black border, 18px around the active area with
       softly rounded outer corners. A ring (evenodd), not a rect, for the
       same reason as the case. -->
  <path id="glass-border"
        fill-rule="evenodd"
        fill="url(#glass-sheen)"
        d="M 87,79 H 907 A 8,8 0 0 1 915,87 V 588 A 8,8 0 0 1 907,596 H 87
           A 8,8 0 0 1 79,588 V 87 A 8,8 0 0 1 87,79 Z
           M 97,97.5 H 897 V 577.5 H 97 Z" />
  <!-- Where case meets glass: a hairline catching the light on top. -->
  <path fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"
        d="M 87,78.5 H 907" />

  <!-- Measurement-only marker. No fill, no stroke: the hole above is what
       is visible, this is what the designer measures. -->
  <rect id="screen" x="97" y="97.5" width="800" height="480"
        fill="none" stroke="none"
        inkscape:label="screen" />
</svg>
