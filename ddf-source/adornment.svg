<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Adornment for the Waveshare ESP32-S3-Knob-Touch-LCD-1.8, authored
  2026-08-19 from a photo of the real unit: a plain blue ring case with an
  additional black ring between the case and the round screen.

  Hand-authored rather than extracted from the M5 Dial's Inkscape output -
  the geometry here is two concentric discs plus two arrows, and the
  conventions this file must satisfy are only: a rect whose id is "screen",
  any covers whose ids start with "offscreen", and elements whose ids start
  with "button" carrying an inkscape:label (see the designer repo's
  DEVICE_GUIDE.md, "Building the adornment SVG").

  CAUTION, learned the hard way while writing this file: the designer parses
  this SVG with regexes, not an XML parser, so it happily matches inside
  comments too. An earlier draft of this very comment spelled the screen
  rect out as literal markup and the parser picked *that* up instead of the
  real element, failing with "screen rect missing x attribute". Never write
  tag syntax in a comment here - describe elements in prose, as above.

  Geometry: centre (270,270). Screen is the 360x360 square at (90,90);
  the panel itself is round, so only the r=180 inscribed circle can ever
  show anything - the square's corners are masked by offscreen-0. Black
  ring r=180..200, blue case r=200..270. The case radius is deliberately
  larger than the screen square's own corner distance (254.6) so no corner
  sticks out past the case.

  Both rings are real annuli - an outer arc plus an inner one, with
  even-odd fill - and NOT two stacked filled discs. Stacked discs render
  identically in any picture viewer, which is exactly why the first version
  of this file used them and looked fine: the designer draws this artwork on
  top of the live project canvas, so the innermost disc covered the entire
  drawing area with opaque black. Reported 2026-08-21 as "the canvas is a
  black disc". This is the first rule in the designer's DEVICE_GUIDE.md
  ("the screen area must be a real punched-out hole"), and the designer repo
  now has an e2e case per device that reads the centre pixel of the screen
  rect, so the same mistake fails a test instead of a user.

  Only two buttons, unlike the M5 Dial's five: this knob has no press-
  modifier, and turning is reserved for adjusting values rather than
  navigating (screen switching is a swipe-up). See the designer repo's
  docs/device-contract.md and the 2026-08-19 port decisions.
-->

<svg
   width="540"
   height="540"
   viewBox="0 0 540 540"
   version="1.1"
   id="svg1"
   sodipodi:docname="adornment.svg"
   inkscape:version="1.4.2 (f4327f4, 2025-05-13)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs1">
    <linearGradient
       id="linearGradient5"
       inkscape:collect="always">
      <stop
         style="stop-color:#124c80;stop-opacity:1;"
         offset="0"
         id="stop6" />
      <stop
         style="stop-color:#c3dff6;stop-opacity:1;"
         offset="1"
         id="stop7" />
    </linearGradient>
    <linearGradient
       inkscape:collect="always"
       xlink:href="#linearGradient5"
       id="linearGradient7"
       x1="270"
       y1="90.000023"
       x2="810"
       y2="90.000023"
       gradientUnits="userSpaceOnUse"
       spreadMethod="reflect"
       gradientTransform="matrix(0.98190252,0,0,0.98190251,-260.22736,181.62875)" />
  </defs>
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     showguides="true"
     inkscape:zoom="0.70710678"
     inkscape:cx="230.51681"
     inkscape:cy="80.610173"
     inkscape:window-width="960"
     inkscape:window-height="730"
     inkscape:window-x="-6"
     inkscape:window-y="-6"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg1">
    <sodipodi:guide
       position="619.11127,270"
       orientation="0,1"
       id="guide1"
       inkscape:locked="false"
       inkscape:label=""
       inkscape:color="rgb(0,134,229)" />
    <sodipodi:guide
       position="270,540"
       orientation="-1,0"
       id="guide2"
       inkscape:locked="false"
       inkscape:label=""
       inkscape:color="rgb(0,134,229)" />
  </sodipodi:namedview>
  <!-- Blue ring case, r=200..270. -->
  <path
     d="M 0 270 A 270 270 0 1 0 540 270 A 270 270 0 1 0 0 270 Z M 70 270 A 200 200 0 1 0 470 270 A 200 200 0 1 0 70 270 Z"
     fill-rule="evenodd"
     style="fill:#1b71bc;stroke:none;fill-opacity:1"
     id="case-body"
     inkscape:label="case" />
  <!-- Black ring between case and screen, r=180..200. -->
  <path
     d="M 70 270 A 200 200 0 1 0 470 270 A 200 200 0 1 0 70 270 Z M 90 270 A 180 180 0 1 0 450 270 A 180 180 0 1 0 90 270 Z"
     fill-rule="evenodd"
     style="fill:#3c3c4b;stroke:none;fill-opacity:1"
     id="case-inner-ring"
     inkscape:label="inner ring" />
  <!-- The screen area. Position and size are read straight off this rect
       (extractScreenRect), so it is never hand-transcribed into
       device.json. -->
  <rect
     x="90"
     y="90"
     width="360"
     height="360"
     style="fill:none;stroke:none"
     id="screen"
     inkscape:label="screen" />
  <!-- The corners of that square the round panel cannot display. The fill
       is replaced at render time by the editor's own container background
       (readOffscreenColor), so what is declared here is irrelevant - hence
       fill:none, matching the M5 Dial's cover. -->
  <path
     d="M 90 90 H 450 V 450 H 90 Z M 90 270 A 180 180 0 1 0 450 270 A 180 180 0 1 0 90 270 Z"
     fill-rule="evenodd"
     style="display:inline;fill:none;fill-opacity:1;stroke:none"
     id="offscreen-0"
     inkscape:label="offscreen-0" />
  <!-- Rim highlight: a gradient stroke around the case edge. -->
  <circle
     style="fill:#d40000;fill-opacity:0;stroke:url(#linearGradient7);stroke-width:9.819;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;paint-order:stroke fill markers"
     id="path2"
     cx="270"
     cy="270"
     r="265.11368" />
  <!-- Rotation inputs: two arrows curving over the top of the case. Filled
       rather than only stroked so the designer's Path2D hit-testing has real
       area to hit. ids must match exactly what the firmware uses to key
       button actions. Their rotate() transform is read by the designer's
       own SVG transform parser, not DOMMatrix, which rejects it. -->
  <path
     id="button-1"
     style="opacity:1;baseline-shift:baseline;display:inline;overflow:visible;fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:2.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1;paint-order:stroke fill markers;enable-background:accumulate;stop-color:#000000;stop-opacity:1"
     d="m 198.46132,365.55289 a 8.6899996,8.6899996 0 0 0 -7.5242,-4.34338 8.6899996,8.6899996 0 0 0 -8.69258,8.68931 c 0,45.49352 -10.99602,90.25197 -31.979,130.49894 l -10.7686,-6.22704 -0.004,42.75548 37.04994,-21.33492 -11.21765,-6.48629 c 22.5027,-42.8967 34.30087,-90.65889 34.30087,-139.20726 a 8.6899996,8.6899996 0 0 0 -1.16492,-4.34484 z"
     transform="rotate(-60.816086)"
     inkscape:label="Rotate Right" />
  <path
     id="button-0"
     style="opacity:1;baseline-shift:baseline;display:inline;overflow:visible;fill:#ffffff;fill-opacity:1;stroke:#000000;stroke-width:2.9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1;paint-order:stroke fill markers;enable-background:accumulate;stop-color:#000000"
     d="m 55.867975,111.16082 a 8.6899996,8.6899996 0 0 1 -0.24808,8.6843 8.6899996,8.6899996 0 0 1 -11.95731,2.84391 C 4.9279249,98.829313 -38.947895,84.717484 -84.220295,81.474986 l -0.34584,12.434595 -36.405515,-22.420307 37.596615,-20.356127 -0.36062,12.952899 c 48.32551,3.338246 95.17951,18.342453 136.51518,43.804334 a 8.6899996,8.6899996 0 0 1 3.08837,3.27056 z"
     transform="rotate(-60.816086)"
     inkscape:label="Rotate Left" />
</svg>
