  <path
     d="M 105 105 H 495 V 495 H 105 Z M 105 300 A 195 195 0 1 0 495 300 A 195 195 0 1 0 105 300 Z"
     fill-rule="evenodd"
     style="display:inline;fill:none;fill-opacity:1;stroke:none"
