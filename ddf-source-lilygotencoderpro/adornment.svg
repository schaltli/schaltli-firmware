   width="600"
   height="600"
   viewBox="0 0 600 600"
   version="1.1"
   id="svg1"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <path
     d="M 8 300 A 292 292 0 1 0 592 300 A 292 292 0 1 0 8 300 Z M 85 300 A 215 215 0 1 0 515 300 A 215 215 0 1 0 85 300 Z"
     fill-rule="evenodd"
     style="fill:#2b2d31;stroke:#55585e;stroke-width:3"
