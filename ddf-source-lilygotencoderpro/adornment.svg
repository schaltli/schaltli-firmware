  <path
     d="M 572.00 300.00 L 584.00 300.00 M 570.96 323.71 L 582.92 324.75 M 567.87 347.23 L 579.69 349.32 M 562.73 370.40 L 574.32 373.50 M 555.60 393.03 L 566.87 397.13 M 546.52 414.95 L 557.39 420.02 M 535.56 436.00 L 545.95 442.00 M 522.81 456.01 L 532.64 462.90 M 508.36 474.84 L 517.56 482.55 M 492.33 492.33 L 500.82 500.82 M 474.84 508.36 L 482.55 517.56 M 456.01 522.81 L 462.90 532.64 M 436.00 535.56 L 442.00 545.95 M 414.95 546.52 L 420.02 557.39 M 393.03 555.60 L 397.13 566.87 M 370.40 562.73 L 373.50 574.32 M 347.23 567.87 L 349.32 579.69 M 323.71 570.96 L 324.75 582.92 M 300.00 572.00 L 300.00 584.00 M 276.29 570.96 L 275.25 582.92 M 252.77 567.87 L 250.68 579.69 M 229.60 562.73 L 226.50 574.32 M 206.97 555.60 L 202.87 566.87 M 185.05 546.52 L 179.98 557.39 M 164.00 535.56 L 158.00 545.95 M 143.99 522.81 L 137.10 532.64 M 125.16 508.36 L 117.45 517.56 M 107.67 492.33 L 99.18 500.82 M 91.64 474.84 L 82.44 482.55 M 77.19 456.01 L 67.36 462.90 M 64.44 436.00 L 54.05 442.00 M 53.48 414.95 L 42.61 420.02 M 44.40 393.03 L 33.13 397.13 M 37.27 370.40 L 25.68 373.50 M 32.13 347.23 L 20.31 349.32 M 29.04 323.71 L 17.08 324.75 M 28.00 300.00 L 16.00 300.00 M 29.04 276.29 L 17.08 275.25 M 32.13 252.77 L 20.31 250.68 M 37.27 229.60 L 25.68 226.50 M 44.40 206.97 L 33.13 202.87 M 53.48 185.05 L 42.61 179.98 M 546.52 185.05 L 557.39 179.98 M 555.60 206.97 L 566.87 202.87 M 562.73 229.60 L 574.32 226.50 M 567.87 252.77 L 579.69 250.68 M 570.96 276.29 L 582.92 275.25"
     style="fill:none;stroke:#6b6f76;stroke-width:3;stroke-linecap:round"
     id="case-knurl"
     inkscape:label="knurl" />
  <path
