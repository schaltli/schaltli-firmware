<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Adornment for the LilyGO T-Encoder Pro, authored 2026-11-22 for the
  designer repo's tasks/lilygo-t-encoder-pro-plan.md: a round dark body whose
  outer ring turns, around a round 1.2 inch AMOLED.

  Written by a script from plain geometry, like the knob's: the conventions
  are a rect whose id is "screen", covers whose ids start with "offscreen",
  and elements whose ids start with "button" carrying an inkscape:label
  (designer DEVICE_GUIDE.md, "Building the adornment SVG"). As there: the
  designer reads this file with regexes, so no tag syntax in comments.

  Geometry: centre (300,300). Screen is the 390x390 square at (105,105), the
  panel shows only its inscribed circle (r=195), the corners are masked by
  offscreen-0. Black bezel r=195..215, the turning ring r=215..292, the
  case's corner distance (275.8) inside the ring.

  Three buttons: turning left and right as on the knob, and pressing - the
  ring is also a push key (GPIO 0), which the knob does not have. The ids
  are the firmware's: button-0, button-1, button-2.
-->
