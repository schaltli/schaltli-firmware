; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:waveshare-knob-touch-lcd-1v8]
; Regenerates src/ddf_zip.h from ddf-source/ before compiling, so the DDF
; the firmware serves cannot be older than the DDF in this repo. See
; tools/pre_build_ddf.py for the day that cost.
extra_scripts =
    pre:tools/pre_build_ddf.py
    pre:tools/pre_build_firmware_build.py
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; src/boards/ holds one main.cpp per board target. Every env must exclude
; the ones that are not its own, or two setup()/loop() pairs end up in the
; same binary and the link fails with a duplicate-symbol error that says
; nothing about the cause.
build_src_filter = +<*> -<boards/>

; ESP32-S3 N16R8: 16MB quad flash, 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    ; This board's own DeviceInfo.h and generated ddf_zip.h. They used to sit
    ; in src/, which made every `#include "DeviceInfo.h"` from a shared .cpp
    ; resolve to them by proximity - so the 4.3B firmware shipped this
    ; board's DEVICE_ID and served this board's DDF. Per-board directories
    ; plus this include path are what let a second target have an identity
    ; of its own at all.
    -Isrc/boards/waveshareknob1v8
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    ; include/lv_conf.h isn't reliably picked up for every single LVGL
    ; translation unit in this project's build (observed: lv_font_montserrat_32.c
    ; compiled to an empty object despite lv_conf.h enabling it, on a full
    ; clean rebuild - not a caching artifact). Force the settings that must
    ; be uniform across the whole library here too, since -D flags apply to
    ; every compile regardless of any per-file #include resolution flakiness.
    -DLV_FONT_MONTSERRAT_32=1
    -DLV_TICK_CUSTOM=0
    ; The QR generator LVGL ships (extra/libs/qrcode/qrcodegen.c) - used
    ; directly by CanvasDisplayAdapter for the setup screen, not through
    ; lv_qrcode. Set here rather than in lv_conf.h for the same reason as
    ; the font above: that file is not tracked as a dependency of LVGL's
    ; own sources, so an edit there can silently fail to take effect.
    -DLV_USE_QRCODE=1
    ; 32KB loop-task stack (default 8192) - the ported project loader parses
    ; whole-project JSON on this task. PlatformIO's
    ; board_build.arduino.loop_stack_size does not work on this framework
    ; version; the plain define is what the Arduino core's main.cpp actually
    ; reads. Carried over from screenbee-m5dial, where 64KB was tried and
    ; reverted: the stack comes out of the general heap and starved
    ; ArduinoJson during normal project loading.
    -DARDUINO_LOOP_STACK_SIZE=32768
    ; --- miniz (vendored in lib/miniz/, zip extraction for deploys) ---
    -DMINIZ_EXPORT=
    -Ilib/miniz
    ; ProjectInstaller only ever *reads* zips (mz_zip_reader_*, inflate);
    ; nothing here writes one. Disabling the deflate side compiles
    ; miniz_tdef.c down to nothing, which on the M5 Dial was what stopped
    ; M5GFX's own vendored miniz subset from duplicate-symbol-conflicting at
    ; link time. Arduino_GFX may or may not vendor the same code - keeping
    ; the flag costs nothing and removes the question. Note
    ; MINIZ_NO_ARCHIVE_WRITING_APIS would NOT be enough: it only guards the
    ; mz_zip_writer_* wrappers, while the tdefl_* primitives compile
    ; regardless. Must be a global flag, not a #define in a .cpp, to reach
    ; miniz's separately-compiled .c files.
    -DMINIZ_NO_DEFLATE_APIS
    ; One of the two fixes for the DEFLATE-extraction crash root-caused over
    ; JTAG on the M5 Dial (2026-08-09). Unaligned access is legal on this
    ; core but miniz's fast path tripped over it in practice; leave off.
    -DMINIZ_USE_UNALIGNED_LOADS_AND_STORES=0

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    lvgl/lvgl@^8.4.0
    ; The project-rendering stack, ported from screenbee-m5dial@d73d0ff.
    ; Adafruit GFX supplies GFXcanvas16 (ClippedCanvas16's base) and
    ; U8g2_for_Adafruit_GFX rasterizes the DDF's BDF fonts into it. That
    ; pairing is deliberately the same one the M5 Dial and the e-paper
    ; firmware use rather than this board's own Arduino_GFX text drawing:
    ; its pixel behavior is what was HIL-tuned to match the designer
    ; exactly, and none of that tuning is board-specific.
    adafruit/Adafruit GFX Library
    https://github.com/olikraus/U8g2_for_Adafruit_GFX.git
    ; Project model parsing (ProjectLoader). miniz is not listed here - it is
    ; vendored in lib/miniz/, copied from the same upstream commit
    ; MqttEPaperDisplay2 runs in production, because it carries a local patch
    ; to mz_zip_reader_extract_iter_new(); see that directory.
    bblanchon/ArduinoJson
    ; MQTT transport (MqttClient) - deploy trigger/status plus the project's
    ; own data topics.
    knolleary/PubSubClient @ ^2.8
    ; NOTE: olikraus/U8g2 is deliberately NOT listed, even though
    ; screenbee-m5dial lists it. Arduino_GFX.h does
    ; `#if __has_include(<U8g2lib.h>)` and pulls in the full U8g2 library
    ; when it is present, which then collides with U8g2_for_Adafruit_GFX's
    ; own vendored copy of the same decoder ("redefinition of struct
    ; _u8g2_font_info_t"). The M5 Dial never hits this because it uses
    ; M5GFX, not Arduino_GFX. Nothing is lost: U8g2_for_Adafruit_GFX ships
    ; its own u8g2_fonts.c, including the whole helvR set the DDF names.

monitor_speed = 115200


; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-Touch-LCD-4.3B - 800x480 RGB parallel, GT911 touch,
; CH422G IO expander, 7-36V input. Second supported target alongside the
; knob; the shared src/ is the point, so board-specific code lives only in
; src/boards/waveshare4v3b/ and everything else is compiled from the same
; files both envs use.
;
; MILESTONE 1 (this config): panel only. No LVGL, no project loader, no
; MQTT, no touch - so a black screen can only be the RGB timings or the pin
; map. The dependency list is deliberately minimal for the same reason; it
; grows as the stack is layered back on.
[env:waveshare-touch-lcd-4v3b]
; Writes src/FirmwareBuild.h, the build's identity - see the script.
extra_scripts = pre:tools/pre_build_firmware_build.py
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Named explicitly rather than as "everything except the knob", because
; src/ does not separate the two: project/ and interfaces/ are device
; independent, but CanvasPresenter, CanvasDisplayAdapter,
; RotaryEncoderReader, ScreenNavigatorOverlay and the knob's own main.cpp
; sit in the same root directory next to them. Moving those into
; src/boards/waveshareknob1v8/ is the right shape and is deliberately not
; done here: it would touch a verified firmware whose HIL cannot be run at
; the moment. When this list stops being readable, that is the signal.
build_src_filter =
    -<*>
    +<boards/waveshare4v3b/>
    +<project/>
    ; Services that are board-independent by construction - each takes what
    ; it needs through an interface or a callback. Named one by one rather
    ; than as a directory because they sit in src/ next to the knob's own
    ; main.cpp, CanvasPresenter, CanvasDisplayAdapter and
    ; RotaryEncoderReader, which must not come along.
    +<MqttClient.cpp>
    +<DeployManager.cpp>
    +<DeviceSettings.cpp>
    +<NvsConfigStorage.cpp>
    +<WiFiSetupServer.cpp>
    +<TestInterfaceServer.cpp>

; Same module as the knob: ESP32-S3-WROOM-1-N16R8.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    ; See the knob env's note: without this, a shared .cpp including
    ; "DeviceInfo.h" or "ddf_zip.h" picks up whichever copy sits nearest it,
    ; and this board announced itself as the knob.
    -Isrc/boards/waveshare4v3b
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; miniz is vendored in lib/miniz/ and read-only here, same as the knob
    ; env - see that env's comments for why each of these matters.
    -DMINIZ_EXPORT=
    -Ilib/miniz
    -DMINIZ_NO_DEFLATE_APIS
    -DMINIZ_USE_UNALIGNED_LOADS_AND_STORES=0
    ; The project loader parses whole-project JSON on the loop task.
    -DARDUINO_LOOP_STACK_SIZE=32768

lib_deps =
    ; No Arduino_GFX here, unlike the knob. That board needs it for a real
    ; display driver - QSPI transport, the ST77916 init sequence, and the
    ; bitmap push LVGL flushes through. This one has an RGB panel driven by
    ; the S3's own LCD peripheral, where the whole driver is a filled-in
    ; config struct, and it fills that in itself so it can ask for three
    ; framebuffers - see boards/waveshare4v3b/RgbPanel.h.
    ; The shared rendering stack. Same pairing as the knob, the M5 Dial and
    ; the e-paper firmware on purpose: Adafruit GFX supplies GFXcanvas16
    ; (ClippedCanvas16's base) and U8g2_for_Adafruit_GFX rasterizes the DDF's
    ; BDF fonts into it. That pixel behaviour is what was HIL-tuned against
    ; the designer, and none of the tuning is board specific.
    adafruit/Adafruit GFX Library
    https://github.com/olikraus/U8g2_for_Adafruit_GFX.git
    bblanchon/ArduinoJson
    ; MQTT transport: deploy trigger and status, plus the project's own data
    ; topics.
    knolleary/PubSubClient @ ^2.8
    ; NOTE: olikraus/U8g2 stays off this list for the same reason as in the
    ; knob env - Arduino_GFX pulls it in via __has_include and it then
    ; collides with U8g2_for_Adafruit_GFX's own vendored decoder.

monitor_speed = 115200

[env:m5stack-papers3]
; Writes src/FirmwareBuild.h, the build's identity - see the script.
extra_scripts = pre:tools/pre_build_firmware_build.py
platform = espressif32
; No m5stack_papers3 board definition exists in this PlatformIO core - the
; m5stack_paper it does carry is the older ESP32 M5Paper, a different chip.
; The generic S3 devkit plus the module settings below is what the other two
; boards here already use, and it describes this hardware exactly.
board = esp32-s3-devkitc-1
framework = arduino

; Named explicitly, like the 4.3B's - see that env's note on why src/ cannot
; simply be included wholesale.
build_src_filter =
    -<*>
    +<boards/papers3/>
    +<project/>
    +<MqttClient.cpp>
    +<DeployManager.cpp>
    +<DeviceSettings.cpp>
    +<NvsConfigStorage.cpp>
    +<WiFiSetupServer.cpp>
    +<TestInterfaceServer.cpp>

; ESP32-S3 with 16MB flash and 8MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; This board is flashed over the S3's own USB, and the chip presents a
; different USB device in download mode than the running firmware does. The
; moment the flash write finishes, that device re-enumerates underneath
; esptool, so its closing reset cannot open the port any more and the upload
; ends in "Cannot configure port" - after four verified hashes, with the
; firmware correctly written. A failure report for a success.
;
; So it is told not to try. Press the side button once after flashing, or
; unplug and replug, and the new firmware runs.
;
; board_upload.after_reset rather than upload_flags: the platform builds its
; own "--after hard_reset" into the esptool command line, and an extra
; "--after" appended after it does not win.
board_upload.after_reset = no_reset

build_flags =
    ; Without this, a shared .cpp including "DeviceInfo.h" or "ddf_zip.h"
    ; picks up whichever copy sits nearest it - which is how the 4.3B once
    ; announced itself as the knob.
    -Isrc/boards/papers3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; miniz is vendored in lib/miniz/ and read-only here, same as the other
    ; two envs - see the knob env's comments for why each of these matters.
    -DMINIZ_EXPORT=
    -Ilib/miniz
    -DMINIZ_NO_DEFLATE_APIS
    -DMINIZ_USE_UNALIGNED_LOADS_AND_STORES=0
    ; The project loader parses whole-project JSON on the loop task.
    -DARDUINO_LOOP_STACK_SIZE=32768

lib_deps =
    ; The panel is driven by the ESP32-S3 itself over a parallel interface,
    ; and M5 supplies that driver. M5GFX is used for the panel only - the
    ; rendering above it is the same Adafruit GFX canvas every other board
    ; here draws into, because that pixel behaviour is what was HIL-tuned
    ; against the designer and none of it is board specific.
    m5stack/M5Unified
    m5stack/M5GFX
    adafruit/Adafruit GFX Library
    https://github.com/olikraus/U8g2_for_Adafruit_GFX.git
    bblanchon/ArduinoJson
    knolleary/PubSubClient @ ^2.8

monitor_speed = 115200
